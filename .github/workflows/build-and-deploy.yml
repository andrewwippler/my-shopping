name: Deploy to Wippler k8s

on:
  push:
    branches:
      - main

env:
  REPOSITORY: shopping
  REGISTRY: d.wplr.rocks

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REG_USER }}
          password: ${{ secrets.REG_PW }}

      - name: Set build environment variables
        run: |
          echo "NEXT_PUBLIC_WS_URL=https://shopping.wplr.rocks" > frontend/.env.local
          echo "DATABASE_URL=postgresql://<user>:<pass>@<host>:5432/<dbname>?schema=public" > server/.env

      - name: Build and push Frontend image
        uses: docker/build-push-action@v3
        with:
          context: frontend/.
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}-fe:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}-fe:latest

      - name: Build and push Server image
        uses: docker/build-push-action@v3
        with:
          context: server/.
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}-s:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}-s:latest

      - name: Updating FE
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Key: $WEBHOOK_SECRET" \
            -d "{
              \"version\": \"${{ github.sha }}\",
              \"ns\": \"web\",
              \"deploy\": \"shopping\",
              \"container\": \"shopping\",
              \"image\": \"${{ env.REPOSITORY }}-fe\",
              \"prefix\": \"${{ env.REGISTRY }}\"
            }"

      - name: Updating Server
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Key: $WEBHOOK_SECRET" \
            -d "{
              \"version\": \"${{ github.sha }}\",
              \"ns\": \"web\",
              \"deploy\": \"shopping-server\",
              \"container\": \"shopping-server\",
              \"image\": \"${{ env.REPOSITORY }}-s\",
              \"prefix\": \"${{ env.REGISTRY }}\"
            }"
